name: CareerFlow verification
on: [push, pull_request]
jobs:
  verify:
    # GitHub Enterprise Server may require an administrator-provisioned runner.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: careerflow
          POSTGRES_PASSWORD: careerflow-test
          POSTGRES_DB: careerflow_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U careerflow -d careerflow_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://careerflow:careerflow-test@localhost:5432/careerflow_test
      PROVIDER_MODE: fixture
      JOB_SOURCE: fixtures
      ENABLE_DEMO_LOGIN: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run db:migrate
      - run: npm run verify
      - run: npx playwright install --with-deps chromium
      - run: npm start > /tmp/careerflow.log 2>&1 &
      - run: node scripts/wait-ready.mjs
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-evidence
          path: |
            playwright-report
            output/acceptance
